services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/dados.db
    volumes:
      - dados:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dados:
